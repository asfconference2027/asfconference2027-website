name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # TEMPORARY: makes this Pages build resolve assets correctly under
          # the /asfconference2027-website/ subpath for collaborator review.
          # Remove this env block (or set it to '/') once the real
          # asfconference2027.com.au domain is pointed at Pages — see
          # MIGRATION.md. Local dev/builds are unaffected either way, since
          # vite.config.ts defaults to '/' when this isn't set.
          VITE_BASE_PATH: /asfconference2027-website/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
